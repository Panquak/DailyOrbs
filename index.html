<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Orbs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap');

  :root{
    --bg:#0a0a0a; --panel:#151515; --panel-line:#2c2c2c;
    --text:#f4f4f2; --text-dim:#8f8f8a;
    --orange:#E0902A; --green:#5FAF4E; --blue:#3E90D0; --purple:#A25D95;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:36px 32px 100px;}

  /* ---- PUZZLE NAVIGATION ---- */
  .puzzle-nav{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:22px;
  }
  .nav-arrow{
    background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    width:44px; height:44px; border-radius:50%; cursor:pointer;
    font-size:22px; line-height:1; padding:0;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .nav-arrow:hover:not(:disabled){ border-color:var(--text); }
  .nav-arrow:disabled{ opacity:0.25; cursor:default; }
  .nav-center{ text-align:center; flex:1; }
  .nav-date{
    font-family:'Poppins',sans-serif; font-weight:600; font-size:15px;
    color:var(--text-dim); letter-spacing:0.05em; text-transform:uppercase;
  }
  .nav-today{
    background:none; border:none; color:var(--orange); cursor:pointer;
    font-family:'Inter',sans-serif; font-size:13px; padding:4px 0 0;
    text-decoration:underline;
  }

  .hub-header{ text-align:center; margin-bottom:8px; }
  .hub-header h1{
    font-family:'Poppins',sans-serif; font-size:46px; font-weight:800; margin:0;
    display:flex; align-items:center; justify-content:center; gap:2px;
  }
  .hub-header .o-rainbow{
    background:conic-gradient(from 180deg,#e0902a,#5faf4e,#3e90d0,#a25d95,#e0902a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hub-date{ text-align:center; color:var(--text-dim); font-size:19px; margin:14px 0 40px; }

  .cat-row{
    border-top:3px solid var(--accent); padding:26px 0;
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    cursor:pointer;
  }
  .cat-row:hover .cat-name{ text-decoration:underline; }
  .cat-row:last-child{ border-bottom:3px solid var(--panel-line); }
  .cat-left{ flex:1; }
  .cat-name{ font-family:'Poppins',sans-serif; font-size:27px; font-weight:700; margin:0 0 8px; color:var(--text); }
  .cat-desc{ font-size:17px; color:var(--text-dim); line-height:1.45; margin:0; }
  .cat-right{ text-align:right; flex-shrink:0; }

  .icon-row{ display:flex; gap:9px; justify-content:flex-end; }
  .icon-row.orbs{ margin-bottom:9px; }
  .icon-slot{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-slot .dot{ width:30px; height:30px; border-radius:50%; border:3px solid var(--accent); box-sizing:border-box; }
  .icon-slot .heart{ width:30px; height:30px; display:block; }

  .overlay{ position:fixed; inset:0; background:var(--bg); display:none; overflow-y:auto; z-index:50; }
  .overlay.active{ display:block; }
  .game-wrap{ max-width:820px; margin:0 auto; padding:32px 28px 100px; }
  .game-top-bar{ border-top:4px solid var(--accent); padding-top:18px; margin-bottom:22px; }
  .game-top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .game-title{ font-family:'Poppins',sans-serif; font-size:30px; font-weight:800; margin:0; }
  .game-instructions{ color:var(--text-dim); font-size:18px; margin:8px 0 0; line-height:1.45; }
  .back-link{
    background:none; border:1.5px solid var(--panel-line); color:var(--text);
    font-size:15px; padding:9px 16px; border-radius:8px; cursor:pointer; flex-shrink:0;
  }
  .back-link:hover{ border-color:var(--accent); color:var(--accent); }

  .rules-box{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    padding:16px 18px; margin:20px 0; font-size:16px; color:var(--text-dim); line-height:1.6;
  }

  .fill-row{ margin-bottom:24px; }
  .fill-clue{ font-size:19px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .fill-input-line{ display:flex; gap:10px; }
  .fill-input-line input{
    flex:1; background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    font-size:17px; padding:13px 14px; border-radius:8px; font-family:'Inter',sans-serif;
  }
  .fill-input-line input:focus{ outline:none; border-color:var(--accent); }
  .fill-row.correct .fill-input-line input{ border-color:var(--green); background:#12251a; }
  .fill-row.wrongflash .fill-input-line input{ border-color:#c0392b; }
  .fill-row.revealed .fill-input-line input{ border-color:var(--panel-line); background:var(--panel); color:var(--text-dim); font-style:italic; }
  .fill-submit{
    background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    width:50px; border-radius:8px; cursor:pointer; font-size:19px;
  }
  .fill-submit:hover{ border-color:var(--accent); }
  .fill-submit:disabled{ opacity:0.4; cursor:default; }

  .inline-orbs{ display:inline-flex; gap:6px; vertical-align:middle; }
  .inline-orbs .dot{ width:24px; height:24px; border-radius:50%; border:2.5px solid var(--accent); box-sizing:border-box; }

  .bank-label{ font-size:14px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-dim); margin:20px 0 10px; font-weight:600; }
  .bank{ display:flex; flex-wrap:wrap; gap:11px; margin-bottom:6px; }
  .chip{
    background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    padding:13px 17px; border-radius:22px; font-size:16px; cursor:pointer; user-select:none;
  }
  .chip:hover{ border-color:var(--accent); }

  .center-strip{
    display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
    margin:26px 0; padding:20px; background:var(--panel); border:1.5px dashed var(--panel-line); border-radius:12px;
    font-size:17px;
  }
  .center-slot{
    padding:13px 18px; border-radius:22px; font-size:16px; min-width:120px; text-align:center;
    border:1.5px solid var(--panel-line); color:var(--text-dim);
  }
  .center-slot.filled{ border-color:var(--accent); background:var(--panel); color:var(--text); font-weight:700; cursor:pointer; }
  .center-connector{ color:var(--text-dim); font-size:16px; }

  .img-chip{
    width:150px; height:120px; border:2px solid var(--panel-line); border-radius:12px; overflow:hidden; cursor:pointer;
    background:var(--panel); display:flex; align-items:center; justify-content:center;
  }
  .img-chip:hover{ border-color:var(--accent); }
  .img-chip img{ display:block; width:100%; height:100%; object-fit:cover; }
  .center-slot.img-slot{ padding:8px; min-width:216px; }
  .center-slot.img-slot img{ width:200px; height:150px; display:block; margin:0 auto; object-fit:cover; border-radius:8px; }

  .log-title{
    font-size:14px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-dim);
    margin:32px 0 12px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .log-entry{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--panel-line); font-size:16px;
  }
  .log-entry.wrong span.logtext{ text-decoration:line-through; color:var(--text-dim); }
  .log-entry.revealed span.logtext{ color:var(--text-dim); font-style:italic; }
  .log-content{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .logtext{ display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .logsub{ font-size:14px; color:var(--text-dim); }
  .log-right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .log-orbs{ display:flex; gap:6px; }
  .log-orbs .dot{ width:20px; height:20px; border-radius:50%; border:2px solid var(--accent); box-sizing:border-box; }
  .log-entry .badge{ font-size:20px; flex-shrink:0; }
  .log-check{ font-size:26px; line-height:1; font-weight:700; display:inline-block; flex-shrink:0; }
  .log-flag{ width:56px; height:56px; border-radius:6px; display:inline-block; flex-shrink:0; object-fit:cover; }

  .cat-item-row{
    background:var(--panel); border:1.5px solid var(--panel-line); border-radius:12px;
    padding:18px; margin-bottom:16px;
  }
  .cat-item-row.correct{ border-color:var(--green); background:#12251a; }
  .cat-item-row.failed{ opacity:0.35; border-color:var(--panel-line); background:var(--bg); }
  .cat-item-row.revealed{ border-color:var(--panel-line); background:var(--panel); opacity:0.8; }
  .cat-item-name{
    font-family:'Poppins',sans-serif; font-size:19px; font-weight:600; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .cat-buttons{ display:flex; gap:10px; flex-wrap:wrap; }
  .cat-btn{
    background:var(--bg); border:1.5px solid var(--panel-line); color:var(--text);
    padding:14px 12px; border-radius:10px; cursor:pointer; font-size:15px; flex:1; min-width:100px;
    display:flex; flex-direction:column; align-items:center; gap:5px; font-family:'Inter',sans-serif;
  }
  .cat-btn .emoji{ font-size:22px; }
  .cat-btn:hover:not(.full):not(:disabled){ border-color:var(--accent); }
  .cat-btn:disabled{ opacity:0.35; cursor:default; }
  .cat-btn.full{ opacity:0.22; cursor:default; pointer-events:none; border-style:dashed; }
  .cat-btn.full .more{ color:var(--text-dim); font-style:italic; }
  .cat-btn .more{ font-size:12px; color:var(--text-dim); }
  .cat-btn .more b{ color:var(--text); }
  .cat-item-row.correct .cat-btn{ opacity:0.4; }
  .cat-item-row.correct .cat-btn.full{ opacity:0.22; }
  .cat-item-row.failed .cat-btn{ opacity:0.4; cursor:default; pointer-events:none; }
  .cat-item-row.revealed .cat-btn{ opacity:0.4; cursor:default; pointer-events:none; }

  .done-banner{
    text-align:center; padding:36px 20px; color:var(--accent);
    font-size:20px; font-weight:700; font-family:'Poppins',sans-serif;
  }

  .reveal-btn{
    display:block; width:100%; margin:36px 0 20px;
    background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text-dim);
    padding:16px; border-radius:10px; cursor:pointer; font-size:16px;
    font-family:'Poppins',sans-serif; font-weight:600; letter-spacing:0.03em;
  }
  .reveal-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .reveal-btn:disabled{ opacity:0.5; cursor:default; }

  .share-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; margin:40px 0 0;
    background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    padding:16px; border-radius:10px; cursor:pointer; font-size:16px;
    font-family:'Poppins',sans-serif; font-weight:600; letter-spacing:0.03em;
  }
  .share-btn:hover:not(:disabled){ border-color:var(--orange); color:var(--orange); }
  .share-btn:disabled{ opacity:0.4; cursor:default; }
  .share-btn svg{ width:18px; height:18px; }

  .victory-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .victory-overlay.active{ display:flex; }
  .victory-card{
    background:var(--panel); border:1px solid var(--panel-line);
    border-radius:22px; padding:44px 32px 36px; max-width:420px; width:100%;
    text-align:center; animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn{ 0%{transform:scale(0.85);opacity:0;} 100%{transform:scale(1);opacity:1;} }
  .victory-orbs{ display:flex; gap:10px; justify-content:center; margin-bottom:28px; flex-wrap:wrap; }
  .victory-orbs .vorb{ width:38px; height:38px; border-radius:50%; }
  .victory-card h2{ font-family:'Poppins',sans-serif; font-size:40px; font-weight:800; margin:0 0 14px; color:var(--text); }
  .victory-card p{ font-size:19px; color:var(--text); line-height:1.55; margin:0 0 26px; }
  .trophy-icon{ width:86px; height:86px; margin:0 auto 30px; display:block; stroke:var(--text); fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
  .victory-btn{
    background:var(--bg); border:1.5px solid var(--panel-line); color:var(--text);
    padding:14px 48px; border-radius:12px; cursor:pointer; font-size:18px;
    font-family:'Poppins',sans-serif; font-weight:600;
  }
  .victory-btn:hover{ border-color:var(--orange); color:var(--orange); }

  @media (max-width: 640px){
    .wrap{ padding:24px 20px 80px; }
    .hub-header h1{ font-size:38px; }
    .img-chip{ width:120px; height:100px; }
    .center-slot.img-slot{ min-width:180px; }
    .center-slot.img-slot img{ width:164px; height:124px; }
    .log-flag{ width:48px; height:48px; }
    .victory-card{ padding:36px 24px 28px; }
    .victory-card h2{ font-size:34px; }
    .victory-orbs .vorb{ width:32px; height:32px; }
  }
</style>
</head>
<body>

<div class="wrap" id="hub">
  <div class="puzzle-nav">
    <button class="nav-arrow" id="prevBtn" onclick="goToPuzzle(-1)">&lsaquo;</button>
    <div class="nav-center">
      <div class="nav-date" id="navDate"></div>
      <button class="nav-today" id="navToday" onclick="goToToday()" style="display:none;">Jump to today</button>
    </div>
    <button class="nav-arrow" id="nextBtn" onclick="goToPuzzle(1)">&rsaquo;</button>
  </div>
  <div class="hub-header"><h1>Daily<span class="o-rainbow">&nbsp;O</span>rbs</h1></div>
  <div class="hub-date" id="hubDate"></div>
  <div id="catRows"></div>
  <button class="share-btn" id="shareBtn" onclick="shareResults()" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
    </svg>
    <span>Share Results</span>
  </button>
</div>

<div id="overlays"></div>

<div class="victory-overlay" id="victoryOverlay">
  <div class="victory-card">
    <div class="victory-orbs" id="victoryOrbs"></div>
    <h2>Victory</h2>
    <p id="victoryText">You collected 6 orbs.<br>Congratulations!</p>
    <svg class="trophy-icon" viewBox="0 0 64 64">
      <path d="M20 6h24v16c0 7-5 13-12 13s-12-6-12-13V6z"/>
      <path d="M20 11H12a4 4 0 0 0 0 8h8"/>
      <path d="M44 11h8a4 4 0 0 1 0 8h-8"/>
      <path d="M32 35v8"/><path d="M24 43h16v6H24z"/>
    </svg>
    <button class="victory-btn" onclick="dismissVictory()">Yay</button>
  </div>
</div>

<script src="puzzles.js"></script>
<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const IMG_BASE = 'https://panquak.github.io/DailyOrbs/';
const ORB_EMOJI = { orange:'🟠', green:'🟢', blue:'🔵', purple:'🟣' };
const HEART_EMOJI = { orange:'🧡', green:'💚', blue:'💙', purple:'💜' };
const ORB_HEX = { orange:'#E0902A', green:'#5FAF4E', blue:'#3E90D0', purple:'#A25D95' };
const STORAGE_KEY = 'dailyorbs:v1';

/* ============================================================
   GLOBAL STATE
   ============================================================ */
let ALL_STATE = loadStored();
let CURRENT_DATE = null;
let PUZ = null;           // shorthand for ALL_STATE[CURRENT_DATE]
let CURRENT_CATS = [];    // the CATS array for the current puzzle
const gameRerender = {};  // per-category re-render hooks

/* ============================================================
   UTILITIES
   ============================================================ */
function loadStored(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveStored(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ALL_STATE)); }
  catch(e){}
}
function puzzleDates(){
  return Object.keys(PUZZLES).sort();
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function defaultDate(){
  const dates = puzzleDates();
  if (!dates.length) return null;
  const today = todayStr();
  const notFuture = dates.filter(d => d <= today);
  return notFuture.length ? notFuture[notFuture.length-1] : dates[dates.length-1];
}
function ensureState(date){
  if (!ALL_STATE[date]){
    const cats = {};
    PUZZLES[date].forEach(c=>{
      cats[c.key] = { orbs:0, lives:3, correct:0, dead:false, data:null };
    });
    ALL_STATE[date] = { cats:cats, eventLog:[], orbOrder:[], trophyAwarded:false, victoryShown:false };
  }
  return ALL_STATE[date];
}
function getCatData(key){
  const c = PUZ.cats[key];
  if (!c.data) c.data = {};
  return c.data;
}

/* ============================================================
   PUZZLE LOADING / NAVIGATION
   ============================================================ */
function loadPuzzle(date){
  CURRENT_DATE = date;
  PUZ = ensureState(date);
  CURRENT_CATS = PUZZLES[date];

  // Tear down existing overlays
  document.getElementById('overlays').innerHTML = '';
  for (const k in gameRerender) delete gameRerender[k];

  // Update hash without triggering scroll
  if (location.hash !== '#' + date){
    history.replaceState(null, '', '#' + date);
  }

  renderHub();
  updateNav();
  updateShareButton();
}

function goToPuzzle(delta){
  const dates = puzzleDates();
  const idx = dates.indexOf(CURRENT_DATE);
  const next = idx + delta;
  if (next < 0 || next >= dates.length) return;
  saveStored();
  loadPuzzle(dates[next]);
}
function goToToday(){
  const d = defaultDate();
  if (d && d !== CURRENT_DATE){
    saveStored();
    loadPuzzle(d);
  }
}

function updateNav(){
  const dates = puzzleDates();
  const idx = dates.indexOf(CURRENT_DATE);
  document.getElementById('prevBtn').disabled = (idx <= 0);
  document.getElementById('nextBtn').disabled = (idx >= dates.length - 1);
  const d = new Date(CURRENT_DATE + 'T12:00:00');
  document.getElementById('navDate').textContent =
    d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  const todayDefault = defaultDate();
  document.getElementById('navToday').style.display =
    (CURRENT_DATE !== todayDefault) ? 'inline-block' : 'none';
}

/* ============================================================
   EVENT LOGGING
   ============================================================ */
function logOrb(catKey){
  PUZ.eventLog.push(ORB_EMOJI[catKey]);
  PUZ.orbOrder.push(catKey);
  if (!PUZ.trophyAwarded){
    const totalOrbs = CURRENT_CATS.reduce((s,c)=> s + PUZ.cats[c.key].orbs, 0);
    if (totalOrbs >= 6){
      PUZ.trophyAwarded = true;
      PUZ.eventLog.push('🏆');
      setTimeout(showVictory, 600);
    }
  }
  updateShareButton();
}
function logHeartLoss(catKey){
  PUZ.eventLog.push(HEART_EMOJI[catKey]);
  updateShareButton();
}

/* ============================================================
   VICTORY
   ============================================================ */
function showVictory(){
  if (PUZ.victoryShown) return;
  PUZ.victoryShown = true;
  const firstSix = PUZ.orbOrder.slice(0, 6);
  document.getElementById('victoryOrbs').innerHTML = firstSix.map(k =>
    '<div class="vorb" style="background:' + ORB_HEX[k] + '"></div>'
  ).join('');
  document.getElementById('victoryText').innerHTML = 'You collected 6 orbs.<br>Congratulations!';
  document.getElementById('victoryOverlay').classList.add('active');
}
function dismissVictory(){
  document.getElementById('victoryOverlay').classList.remove('active');
  saveStored();
}

/* ============================================================
   SHARE
   ============================================================ */
function updateShareButton(){
  const btn = document.getElementById('shareBtn');
  if (btn) btn.disabled = !PUZ || PUZ.eventLog.length === 0;
}
function shareResults(){
  const d = new Date(CURRENT_DATE + 'T12:00:00');
  const dateStr = d.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
  const lines = [
    'Daily Orbs — ' + dateStr,
    PUZ.eventLog.join(''),
    '',
    'https://panquak.github.io/DailyOrbs/#' + CURRENT_DATE
  ];
  const text = lines.join('\n');
  if (navigator.share){
    navigator.share({ text }).catch(()=>{});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=> alert('Results copied to clipboard!'))
      .catch(()=> prompt('Copy your results:', text));
  } else {
    prompt('Copy your results:', text);
  }
}

/* ============================================================
   RENDERING HELPERS
   ============================================================ */
function dotFill(correct, start, end, color){
  if(correct >= end) return color;
  if(correct > start){
    const pct = ((correct - start) / (end - start)) * 100;
    return 'conic-gradient(' + color + ' ' + pct + '%, var(--panel) 0)';
  }
  return 'var(--panel)';
}
function dotsHTML(correct, thresholds, color, dead){
  const earnedCount = thresholds.filter(t => correct >= t).length;
  return [0,1,2].map(i=>{
    if (i < earnedCount){
      return '<div class="icon-slot"><div class="dot" style="--accent:' + color + '; background:' + color + ';"></div></div>';
    }
    if (dead){
      return '<div class="icon-slot"><div class="dot" style="--accent:#555; background:var(--bg);"></div></div>';
    }
    const start = i === 0 ? 0 : thresholds[i-1];
    const end = thresholds[i];
    return '<div class="icon-slot"><div class="dot" style="--accent:' + color + '; background:' + dotFill(correct, start, end, color) + ';"></div></div>';
  }).join('');
}
function dotsHTMLWithNewFill(correct, thresholds, color, prevCorrect){
  return [0,1,2].map(i=>{
    const start = i === 0 ? 0 : thresholds[i-1];
    const end = thresholds[i];
    const prevPct = Math.max(0, Math.min(100, ((prevCorrect - start) / (end - start)) * 100));
    const currPct = Math.max(0, Math.min(100, ((correct - start) / (end - start)) * 100));
    let bg;
    if(currPct <= 0){ bg = 'var(--panel)'; }
    else if(prevPct >= currPct){ bg = 'conic-gradient(' + color + ' 0% ' + currPct + '%, var(--panel) ' + currPct + '% 100%)'; }
    else {
      const trans = 'color-mix(in srgb, ' + color + ' 40%, transparent)';
      bg = prevPct > 0
        ? 'conic-gradient(' + color + ' 0% ' + prevPct + '%, ' + trans + ' ' + prevPct + '% ' + currPct + '%, var(--panel) ' + currPct + '% 100%)'
        : 'conic-gradient(' + trans + ' 0% ' + currPct + '%, var(--panel) ' + currPct + '% 100%)';
    }
    return '<div class="icon-slot"><div class="dot" style="--accent:' + color + '; background:' + bg + ';"></div></div>';
  }).join('');
}
function heartsHTML(lives, color){
  return [0,1,2].map(i=>{
    const filled = i < lives;
    return '<div class="icon-slot"><svg class="heart" viewBox="1.25 2.25 21.5 20.25" fill="' + (filled ? color : 'none') + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>';
  }).join('');
}
function badgeHTML(catKey){
  const c = CURRENT_CATS.find(x => x.key === catKey);
  const s = PUZ.cats[catKey];
  return '<div style="text-align:right;">' +
    '<div class="icon-row orbs">' + dotsHTML(s.correct, c.thresholds, c.color, s.dead) + '</div>' +
    '<div class="icon-row hearts">' + heartsHTML(s.lives, c.color) + '</div>' +
    '</div>';
}

/* ============================================================
   HUB
   ============================================================ */
function renderHub(){
  document.getElementById('hubDate').textContent = new Date(CURRENT_DATE + 'T12:00:00')
    .toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
  document.getElementById('catRows').innerHTML = CURRENT_CATS.map(c=>{
    const s = PUZ.cats[c.key];
    return '<div class="cat-row" style="--accent:' + c.color + '" onclick="openGame(\'' + c.key + '\')">' +
      '<div class="cat-left">' +
        '<p class="cat-name">' + c.name + '</p>' +
        '<p class="cat-desc">' + c.desc + '</p>' +
      '</div>' +
      '<div class="cat-right">' +
        '<div class="icon-row orbs">' + dotsHTML(s.correct, c.thresholds, c.color, s.dead) + '</div>' +
        '<div class="icon-row hearts">' + heartsHTML(s.lives, c.color) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ============================================================
   SCORING
   ============================================================ */
function registerCorrect(catKey, n){
  n = n || 1;
  const c = CURRENT_CATS.find(x => x.key === catKey);
  const s = PUZ.cats[catKey];
  if (s.dead) return;
  const prevOrbs = s.orbs;
  s.correct += n;
  s.orbs = c.thresholds.filter(t => s.correct >= t).length;
  for (let i = prevOrbs; i < s.orbs; i++) logOrb(catKey);
  renderHub();
  saveStored();
}
function registerWrong(catKey){
  const s = PUZ.cats[catKey];
  if (s.dead) return;
  if (s.lives > 0){
    s.lives--;
    logHeartLoss(catKey);
    if (s.lives === 0){
      s.dead = true;
      setTimeout(()=>{ if (gameRerender[catKey]) gameRerender[catKey](); }, 450);
    }
  }
  renderHub();
  saveStored();
}
function refreshTopBadge(catKey){
  const el = document.getElementById('topbadge-' + catKey);
  if (el) el.innerHTML = badgeHTML(catKey);
}

/* ============================================================
   OVERLAY SHELL
   ============================================================ */
function openGame(key){
  let el = document.getElementById('overlay-' + key);
  if (!el){
    el = document.createElement('div');
    el.className = 'overlay';
    el.id = 'overlay-' + key;
    document.getElementById('overlays').appendChild(el);
    buildGame(key, el);
  }
  el.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeGame(key){
  document.getElementById('overlay-' + key).classList.remove('active');
  document.body.style.overflow = '';
  saveStored();
}
function shellHTML(c){
  return '<div class="game-wrap">' +
    '<div class="game-top-bar" style="--accent:' + c.color + '">' +
      '<div class="game-top-row">' +
        '<div><h1 class="game-title">' + c.name + '</h1>' +
        '<p class="game-instructions">' + c.desc + '</p></div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px;">' +
          '<button class="back-link" onclick="closeGame(\'' + c.key + '\')">Menu</button>' +
          '<div id="topbadge-' + c.key + '">' + badgeHTML(c.key) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="rules-box">' + c.instructions + '</div>' +
    '</div>' +
    '<div id="gamebody-' + c.key + '"></div>' +
  '</div>';
}
function buildGame(key, el){
  const c = CURRENT_CATS.find(x => x.key === key);
  el.innerHTML = shellHTML(c);
  const body = document.getElementById('gamebody-' + key);
  if (c.type === 'fill') buildFill(c, body);
  if (c.type === 'cross-match') buildCrossMatch(c, body);
  if (c.type === 'categorize') buildCategorize(c, body);
}

/* ============================================================
   FILL
   ============================================================ */
function buildFill(c, body){
  const d = getCatData(c.key);
  if (!d.solved) d.solved = [];
  if (!d.revealed) d.revealed = [];
  if (!d.gains) d.gains = {};
  if (d.done === undefined) d.done = false;
  const solvedSet = new Set(d.solved);
  const revealedSet = new Set(d.revealed);

  function persist(){
    d.solved = Array.from(solvedSet);
    d.revealed = Array.from(revealedSet);
  }

  function render(){
    let html = c.items.map((item, i)=>{
      const isCorrect = solvedSet.has(i);
      const isRevealed = revealedSet.has(i);
      const cls = isCorrect ? 'correct' : (isRevealed ? 'revealed' : '');
      const val = isRevealed ? item.answers[0] : '';
      const disabled = isCorrect || isRevealed || d.done;
      let orbDisplay = '';
      if (isCorrect && d.gains[i] !== undefined){
        const prev = d.gains[i];
        const now = PUZ.cats[c.key].correct;
        orbDisplay = dotsHTMLWithNewFill(now, c.thresholds, c.color, prev);
      }
      return '<div class="fill-row ' + cls + '" id="fillrow-' + c.key + '-' + i + '">' +
        '<div class="fill-clue"><span>' + item.clue + '</span>' +
          '<div class="inline-orbs">' + orbDisplay + '</div></div>' +
        '<div class="fill-input-line">' +
          '<input type="text" id="fillinput-' + c.key + '-' + i + '" autocomplete="off" placeholder="Your answer" value="' + val + '" ' + (disabled ? 'disabled' : '') + '>' +
          '<button class="fill-submit" onclick="window.__fill_' + c.key + '.submit(' + i + ')" ' + (disabled ? 'disabled' : '') + '>&#8629;</button>' +
        '</div>' +
      '</div>';
    }).join('');
    html += '<button class="reveal-btn" onclick="window.__fill_' + c.key + '.reveal()" ' + (d.done ? 'disabled' : '') + '>' + (d.done ? 'Answers Revealed' : 'Reveal Answers') + '</button>';
    body.innerHTML = html;
    c.items.forEach((item, i)=>{
      const input = document.getElementById('fillinput-' + c.key + '-' + i);
      if (input && !input.disabled){
        input.addEventListener('keydown', e => { if (e.key === 'Enter') window['__fill_' + c.key].submit(i); });
      }
    });
  }

  gameRerender[c.key] = render;

  window['__fill_' + c.key] = {
    submit(i){
      if (solvedSet.has(i) || revealedSet.has(i) || d.done) return;
      const item = c.items[i];
      const input = document.getElementById('fillinput-' + c.key + '-' + i);
      const row = document.getElementById('fillrow-' + c.key + '-' + i);
      const val = input.value.trim().toLowerCase().replace(/\s+/g, '');
      const ok = item.answers.some(a => a.toLowerCase().replace(/\s+/g, '') === val);
      const wasDead = PUZ.cats[c.key].dead;
      const prevCorrect = PUZ.cats[c.key].correct;
      if (ok){
        solvedSet.add(i);
        d.gains[i] = prevCorrect;
        row.classList.add('correct');
        input.disabled = true;
        row.querySelector('.fill-submit').disabled = true;
        registerCorrect(c.key, 1);
        refreshTopBadge(c.key);
        if (!wasDead){
          row.querySelector('.inline-orbs').innerHTML =
            dotsHTMLWithNewFill(PUZ.cats[c.key].correct, c.thresholds, c.color, prevCorrect);
        }
        persist();
      } else {
        row.classList.add('wrongflash');
        registerWrong(c.key);
        refreshTopBadge(c.key);
        setTimeout(()=> row.classList.remove('wrongflash'), 400);
      }
    },
    reveal(){
      if (d.done) return;
      d.done = true;
      c.items.forEach((item, i)=>{ if (!solvedSet.has(i)) revealedSet.add(i); });
      persist(); saveStored(); render();
    }
  };
  render();
}

/* ============================================================
   CROSS-MATCH
   ============================================================ */
function buildCrossMatch(c, body){
  const d = getCatData(c.key);
  if (!d.log) d.log = [];
  if (!d.removedLeft) d.removedLeft = [];
  if (!d.removedRight) d.removedRight = [];
  if (d.revealed === undefined) d.revealed = false;
  const removedLeft = new Set(d.removedLeft);
  const removedRight = new Set(d.removedRight);
  let leftSel = null, rightSel = null;

  function persist(){
    d.removedLeft = Array.from(removedLeft);
    d.removedRight = Array.from(removedRight);
  }

  function chipHTML(item, side){
    if (side === 'right' && c.rightIsImage){
      return '<div class="img-chip" onclick="window.__ccm_' + c.key + '.pick(\'right\',\'' + item.id + '\')"><img src="' + IMG_BASE + item.img + '" alt=""></div>';
    }
    return '<div class="chip" onclick="window.__ccm_' + c.key + '.pick(\'' + side + '\',\'' + item.id + '\')">' + item.label + '</div>';
  }
  function centerSlotHTML(side){
    const selId = side === 'left' ? leftSel : rightSel;
    if (!selId){
      return '<div class="center-slot">' + (side === 'left' ? c.leftLabel : c.rightLabel) + '</div>';
    }
    const bank = side === 'left' ? c.leftBank : c.rightBank;
    const item = bank.find(x => x.id === selId);
    if (side === 'right' && c.rightIsImage){
      return '<div class="center-slot img-slot filled" onclick="window.__ccm_' + c.key + '.pick(\'right\',\'' + item.id + '\')"><img src="' + IMG_BASE + item.img + '" alt=""></div>';
    }
    return '<div class="center-slot filled" onclick="window.__ccm_' + c.key + '.pick(\'' + side + '\',\'' + item.id + '\')">' + item.label + '</div>';
  }
  function logEntryHTML(l){
    let rightSide = '';
    if (!l.revealed){
      if (l.wasDead){
        rightSide = l.right
          ? '<span class="log-check" style="color:' + c.color + ';">✓</span>'
          : '<span class="badge">X</span>';
      } else {
        rightSide = '<div class="log-orbs">' + dotsHTMLWithNewFill(l.correct, c.thresholds, c.color, l.prevCorrect) + '</div>';
        if (!l.right) rightSide += '<span class="badge">X</span>';
      }
    }
    const rc = l.image ? '<img class="log-flag" src="' + IMG_BASE + l.image + '" alt="">' : (l.rightText || '');
    return '<div class="log-entry ' + (l.right ? 'right' : 'wrong') + ' ' + (l.revealed ? 'revealed' : '') + '">' +
      '<div class="log-content">' +
        '<span class="logtext">' + l.leftText + ' ' + c.connector + ' ' + rc + '</span>' +
        (l.origin ? '<span class="logsub">' + l.origin + '</span>' : '') +
      '</div>' +
      '<div class="log-right">' + rightSide + '</div>' +
    '</div>';
  }

  function render(){
    const s = PUZ.cats[c.key];
    body.innerHTML =
      '<div class="bank-label">' + c.leftLabel + '</div><div class="bank" id="leftbank-' + c.key + '"></div>' +
      '<div class="center-strip">' + centerSlotHTML('left') +
        '<span class="center-connector">' + c.connector + '</span>' + centerSlotHTML('right') + '</div>' +
      '<div class="bank-label">' + c.rightLabel + '</div><div class="bank" id="rightbank-' + c.key + '"></div>' +
      '<div class="log-title"><span>Guess Log</span>' +
        '<div class="inline-orbs">' + dotsHTML(s.correct, c.thresholds, c.color, s.dead) + '</div></div>' +
      '<div id="log-' + c.key + '"></div>' +
      '<button class="reveal-btn" onclick="window.__ccm_' + c.key + '.reveal()" ' + (d.revealed ? 'disabled' : '') + '>' + (d.revealed ? 'Answers Revealed' : 'Reveal Answers') + '</button>';
    const lb = document.getElementById('leftbank-' + c.key);
    c.leftBank.forEach(item=>{
      if (removedLeft.has(item.id) || leftSel === item.id) return;
      lb.insertAdjacentHTML('beforeend', chipHTML(item, 'left'));
    });
    const rb = document.getElementById('rightbank-' + c.key);
    c.rightBank.forEach(item=>{
      if (removedRight.has(item.id) || rightSel === item.id) return;
      rb.insertAdjacentHTML('beforeend', chipHTML(item, 'right'));
    });
    document.getElementById('log-' + c.key).innerHTML = d.log.slice().reverse().map(logEntryHTML).join('');
  }

  gameRerender[c.key] = render;

  function pick(side, id){
    if (d.revealed) return;
    if (side === 'left') leftSel = (leftSel === id) ? null : id;
    else rightSel = (rightSel === id) ? null : id;
    if (leftSel && rightSel){
      const leftItem = c.leftBank.find(x => x.id === leftSel);
      const rightItem = c.rightBank.find(x => x.id === rightSel);
      const right = leftSel === rightSel;
      const wasDead = PUZ.cats[c.key].dead;
      const prevCorrect = PUZ.cats[c.key].correct;
      if (right){
        removedLeft.add(leftSel); removedRight.add(rightSel);
        registerCorrect(c.key, 1);
      } else {
        registerWrong(c.key);
      }
      d.log.push({
        leftText: leftItem.label,
        rightText: c.rightIsImage ? null : rightItem.label,
        image: c.rightIsImage ? rightItem.img : null,
        origin: rightItem.origin || null,
        right, revealed:false, wasDead,
        prevCorrect, correct: PUZ.cats[c.key].correct
      });
      leftSel = null; rightSel = null;
      refreshTopBadge(c.key);
      persist(); saveStored();
    }
    render();
  }
  function reveal(){
    if (d.revealed) return;
    d.revealed = true;
    leftSel = null; rightSel = null;
    c.leftBank.filter(l => !removedLeft.has(l.id)).forEach(l=>{
      const r = c.rightBank.find(x => x.id === l.id);
      removedLeft.add(l.id); removedRight.add(r.id);
      d.log.push({
        leftText: l.label,
        rightText: c.rightIsImage ? null : r.label,
        image: c.rightIsImage ? r.img : null,
        origin: r.origin || null,
        right:true, revealed:true,
        wasDead: PUZ.cats[c.key].dead,
        prevCorrect: PUZ.cats[c.key].correct,
        correct: PUZ.cats[c.key].correct
      });
    });
    persist(); saveStored(); render();
  }

  window['__ccm_' + c.key] = { pick, reveal };
  render();
}

/* ============================================================
   CATEGORIZE
   ============================================================ */
function buildCategorize(c, body){
  const d = getCatData(c.key);
  if (!d.solved) d.solved = [];
  if (!d.failed) d.failed = [];
  if (!d.revealed) d.revealed = [];
  if (!d.placedCount) d.placedCount = {};
  if (!d.gains) d.gains = {};
  if (d.done === undefined) d.done = false;
  const solved = new Set(d.solved);
  const failed = new Set(d.failed);
  const revealed = new Set(d.revealed);
  const fieldTotals = Object.assign({}, c.fieldTotals);
  c.fields.forEach(f=>{
    if (d.placedCount[f.key] === undefined) d.placedCount[f.key] = 0;
    fieldTotals[f.key] = c.fieldTotals[f.key] - d.placedCount[f.key];
  });

  function persist(){
    d.solved = Array.from(solved);
    d.failed = Array.from(failed);
    d.revealed = Array.from(revealed);
    saveStored();
  }

  function render(){
    let html = c.items.map((item, i)=>{
      let cls = '';
      if (solved.has(i)) cls = 'correct';
      else if (failed.has(i)) cls = 'failed';
      else if (revealed.has(i)) cls = 'revealed';
      const rowLocked = solved.has(i) || failed.has(i) || revealed.has(i) || d.done;
      const buttons = c.fields.map(f=>{
        const remaining = fieldTotals[f.key];
        const isFull = remaining <= 0;
        const disabled = rowLocked || isFull;
        const btnClass = 'cat-btn' + (isFull ? ' full' : '');
        const moreText = isFull ? 'full' : ('<b>' + remaining + '</b> more');
        return '<button class="' + btnClass + '" ' + (disabled ? 'disabled' : '') + ' onclick="window.__ccz_' + c.key + '.pick(' + i + ',\'' + f.key + '\')">' +
          '<span class="emoji">' + f.emoji + '</span>' +
          '<span>' + f.label + '</span>' +
          '<span class="more">' + moreText + '</span>' +
        '</button>';
      }).join('');
      let orbDisplay = '';
      if (solved.has(i) && d.gains[i] !== undefined){
        orbDisplay = dotsHTMLWithNewFill(PUZ.cats[c.key].correct, c.thresholds, c.color, d.gains[i]);
      }
      return '<div class="cat-item-row ' + cls + '" id="catrow-' + c.key + '-' + i + '">' +
        '<div class="cat-item-name"><span>' + item.name + '</span>' +
          '<div class="inline-orbs">' + orbDisplay + '</div></div>' +
        '<div class="cat-buttons">' + buttons + '</div>' +
      '</div>';
    }).join('');
    html += '<button class="reveal-btn" onclick="window.__ccz_' + c.key + '.reveal()" ' + (d.done ? 'disabled' : '') + '>' + (d.done ? 'Answers Revealed' : 'Reveal Answers') + '</button>';
    body.innerHTML = html;
    const allDone = c.items.every((_, i)=> solved.has(i) || failed.has(i) || revealed.has(i));
    if (allDone && !d.done){
      const anyFailed = failed.size > 0;
      body.insertAdjacentHTML('afterbegin', '<div class="done-banner">' + (anyFailed ? 'Puzzle complete (with mistakes)' : 'All items sorted!') + '</div>');
    }
  }

  gameRerender[c.key] = render;

  window['__ccz_' + c.key] = {
    pick(i, field){
      if (solved.has(i) || failed.has(i) || revealed.has(i) || d.done) return;
      if (fieldTotals[field] <= 0) return;
      const item = c.items[i];
      const wasDead = PUZ.cats[c.key].dead;
      const prevCorrect = PUZ.cats[c.key].correct;
      if (item.field === field){
        solved.add(i);
        d.placedCount[field] = (d.placedCount[field] || 0) + 1;
        fieldTotals[field]--;
        d.gains[i] = prevCorrect;
        registerCorrect(c.key, 1);
      } else {
        failed.add(i);
        fieldTotals[item.field]--;
        d.placedCount[field] = d.placedCount[field]; // no change
        registerWrong(c.key);
      }
      refreshTopBadge(c.key);
      persist(); render();
    },
    reveal(){
      if (d.done) return;
      d.done = true;
      c.items.forEach((_, i)=>{ if (!solved.has(i) && !failed.has(i)) revealed.add(i); });
      persist(); render();
    }
  };
  render();
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot(){
  const hash = location.hash.replace('#','');
  const dates = puzzleDates();
  let start = defaultDate();
  if (hash && dates.includes(hash)) start = hash;
  if (!start) {
    document.getElementById('hubDate').textContent = 'No puzzles available';
    return;
  }
  loadPuzzle(start);

  window.addEventListener('hashchange', function(){
    const h = location.hash.replace('#','');
    if (h && h !== CURRENT_DATE && puzzleDates().includes(h)){
      saveStored();
      loadPuzzle(h);
    }
  });
})();
