<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Orbs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap');

  :root{
    --bg:#0a0a0a;
    --panel:#151515;
    --panel-line:#2c2c2c;
    --text:#f4f4f2;
    --text-dim:#8f8f8a;
    --orange:#E0902A;
    --green:#5FAF4E;
    --blue:#3E90D0;
    --purple:#A25D95;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:44px 32px 100px;}

  /* ---- HUB ---- */
  .hub-header{ text-align:center; margin-bottom:8px; }
  .hub-header h1{
    font-family: 'Poppins', sans-serif;
    font-size:46px; font-weight:800; margin:0;
    display:flex; align-items:center; justify-content:center; gap:2px;
  }
  .hub-header .o-rainbow{
    background:conic-gradient(from 180deg,#e0902a,#5faf4e,#3e90d0,#a25d95,#e0902a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hub-date{ text-align:center; color:var(--text-dim); font-size:19px; margin:14px 0 40px; }

  .cat-row{
    border-top:3px solid var(--accent);
    padding:26px 0;
    display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
    cursor:pointer;
  }
  .cat-row:hover .cat-name{ text-decoration:underline; }
  .cat-row:last-child{ border-bottom:3px solid var(--panel-line); }
  .cat-left{ flex:1; }
  .cat-name{ font-family: 'Poppins', sans-serif; font-size:27px; font-weight:700; margin:0 0 8px; color:var(--text); }
  .cat-desc{ font-size:17px; color:var(--text-dim); line-height:1.45; margin:0; }
  .cat-right{ text-align:right; flex-shrink:0; }

  /* ---- ICON ROWS (orbs + hearts) ---- */
  .icon-row{
    display:flex;
    gap:9px;
    justify-content:flex-end;
  }
  .icon-row.orbs{ margin-bottom:9px; }
  .icon-slot{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .icon-slot .dot{
    width:30px; height:30px;
    border-radius:50%;
    border:3px solid var(--accent);
    box-sizing:border-box;
  }
  .icon-slot .heart{
    width:30px; height:30px;
    display:block;
  }

  /* ---- OVERLAY / GAME SCREENS ---- */
  .overlay{ position:fixed; inset:0; background:var(--bg); display:none; overflow-y:auto; z-index:50; }
  .overlay.active{ display:block; }
  .game-wrap{ max-width:820px; margin:0 auto; padding:32px 28px 100px; }
  .game-top-bar{ border-top:4px solid var(--accent); padding-top:18px; margin-bottom:22px; }
  .game-top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .game-title{ font-family: 'Poppins', sans-serif; font-size:30px; font-weight:800; margin:0; }
  .game-instructions{ color:var(--text-dim); font-size:18px; margin:8px 0 0; line-height:1.45; }
  .back-link{
    background:none; border:1.5px solid var(--panel-line); color:var(--text);
    font-size:15px; padding:9px 16px; border-radius:8px; cursor:pointer; flex-shrink:0;
  }
  .back-link:hover{ border-color:var(--accent); color:var(--accent); }

  .rules-box{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:10px;
    padding:16px 18px; margin:20px 0; font-size:16px; color:var(--text-dim); line-height:1.6;
  }
  .rules-box b{ color:var(--text); font-family: 'Poppins', sans-serif; }

  /* fill-in-blank */
  .fill-row{ margin-bottom:24px; }
  .fill-clue{ font-size:19px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .fill-input-line{ display:flex; gap:10px; }
  .fill-input-line input{
    flex:1; background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    font-size:17px; padding:13px 14px; border-radius:8px; font-family: 'Inter', sans-serif;
  }
  .fill-input-line input:focus{ outline:none; border-color:var(--accent); }
  .fill-row.correct .fill-input-line input{ border-color:var(--green); background:#12251a; }
  .fill-row.wrongflash .fill-input-line input{ border-color:#c0392b; }
  .fill-submit{
    background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    width:50px; border-radius:8px; cursor:pointer; font-size:19px;
  }
  .fill-submit:hover{ border-color:var(--accent); }

  /* inline orbs (next to questions / log) */
  .inline-orbs{
    display:inline-flex; gap:6px; vertical-align:middle;
  }
  .inline-orbs .dot{
    width:24px; height:24px;
    border-radius:50%; border:2.5px solid var(--accent); box-sizing:border-box;
  }

  /* two-bank matching */
  .bank-label{ font-size:14px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-dim); margin:20px 0 10px; font-weight:600; }
  .bank{ display:flex; flex-wrap:wrap; gap:11px; margin-bottom:6px; }
  .chip{
    background:var(--panel); border:1.5px solid var(--panel-line); color:var(--text);
    padding:13px 17px; border-radius:22px; font-size:16px; cursor:pointer; user-select:none;
  }
  .chip:hover{ border-color:var(--accent); }

  .center-strip{
    display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
    margin:26px 0; padding:20px; background:var(--panel); border:1.5px dashed var(--panel-line); border-radius:12px;
    font-size:17px;
  }
  .center-slot{
    padding:13px 18px; border-radius:22px; font-size:16px; min-width:120px; text-align:center;
    border:1.5px solid var(--panel-line); color:var(--text-dim); font-family: 'Inter', sans-serif;
  }
  .center-slot.filled{
    border-color:var(--accent); background:var(--panel); color:var(--text); font-weight:700; cursor:pointer;
  }
  .center-connector{ color:var(--text-dim); font-size:16px; }

  .img-chip{
    width:100px; border:2px solid var(--panel-line); border-radius:10px; overflow:hidden; cursor:pointer;
    background:var(--panel);
  }
  .img-chip:hover{ border-color:var(--accent); }
  .img-chip svg{ display:block; width:100%; height:70px; }
  .center-slot.img-slot{ padding:8px; min-width:100px; }
  .center-slot.img-slot svg{ width:80px; height:56px; display:block; margin:0 auto; }

  /* guess log */
  .log-title{
    font-size:14px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-dim);
    margin:32px 0 12px; font-weight:600;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .log-entry{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--panel-line); font-size:16px;
  }
  .log-entry.wrong span.logtext{ text-decoration:line-through; color:var(--text-dim); }
  .log-content{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .logtext{ display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .logsub{ font-size:14px; color:var(--text-dim); }
  .log-right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .log-orbs{ display:flex; gap:6px; }
  .log-orbs .dot{
    width:20px; height:20px;
    border-radius:50%; border:2px solid var(--accent); box-sizing:border-box;
  }
  .log-entry .badge{ font-size:20px; flex-shrink:0; }
  .log-flag{
    width:30px; height:30px;
    border-radius:4px;
    display:inline-block;
    flex-shrink:0;
  }

  /* categorize - all at once */
  .cat-item-row{
    background:var(--panel); border:1.5px solid var(--panel-line); border-radius:12px;
    padding:18px; margin-bottom:16px;
  }
  .cat-item-row.correct{ border-color:var(--green); background:#12251a; }
  .cat-item-row.failed{ opacity:0.35; border-color:var(--panel-line); background:var(--bg); }
  .cat-item-name{
    font-family: 'Poppins', sans-serif; font-size:19px; font-weight:600; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .cat-buttons{ display:flex; gap:10px; flex-wrap:wrap; }
  .cat-btn{
    background:var(--bg); border:1.5px solid var(--panel-line); color:var(--text);
    padding:14px 12px; border-radius:10px; cursor:pointer; font-size:15px; flex:1; min-width:100px;
    display:flex; flex-direction:column; align-items:center; gap:5px; font-family: 'Inter', sans-serif;
  }
  .cat-btn .emoji{ font-size:22px; }
  .cat-btn:hover{ border-color:var(--accent); }
  .cat-btn:disabled{ opacity:0.35; cursor:default; }
  .cat-btn .more{ font-size:12px; color:var(--text-dim); }
  .cat-btn .more b{ color:var(--text); }
  .cat-item-row.correct .cat-btn{ opacity:0.4; }
  .cat-item-row.failed .cat-btn{ opacity:0.4; cursor:default; pointer-events:none; }

  .done-banner{
    text-align:center; padding:36px 20px; color:var(--accent);
    font-size:20px; font-weight:700; font-family: 'Poppins', sans-serif;
  }
</style>
</head>
<body>

<div class="wrap" id="hub">
  <div class="hub-header"><h1>Daily<span class="o-rainbow">&nbsp;O</span>rbs</h1></div>
  <div class="hub-date" id="hubDate"></div>
  <div id="catRows"></div>
</div>

<div id="overlays"></div>

<script>
/* ============ DATA ============ */

const CATS = [
  {
    key:'orange', color:'var(--orange)', name:'Triples',
    desc:'Find the word with three of the same letter.',
    type:'fill',
    thresholds:[3,6,9],
    total:10,
    instructions:'Each answer contains a letter that appears exactly three times. Type the word that fits the clue.',
    items:[
      {clue:'Often accompanying bedtime', answers:['lullaby']},
      {clue:'Peelable yellow fruit', answers:['banana']},
      {clue:'Soapy sphere that floats', answers:['bubble']},
      {clue:'Achieving a goal', answers:['success']},
      {clue:'Very young dog', answers:['puppy']},
      {clue:'Tracks finances for a business', answers:['bookkeeper']},
      {clue:'Lines that never meet', answers:['parallel']},
      {clue:'Soft, light fuzz', answers:['fluff']},
      {clue:'Wrapped Egyptian body', answers:['mummy']},
      {clue:'Familiar name for a father', answers:['daddy']},
    ]
  },
  {
    key:'green', color:'var(--green)', name:'Subspecies',
    desc:'Pair each modifier with the animal it names.',
    type:'cross-match',
    thresholds:[2,5,8],
    total:10,
    instructions:'Tap a modifier, then tap the animal it goes with — tap either again to deselect before it locks in.',
    connector:'·',
    leftLabel:'Modifier',
    rightLabel:'Animal',
    leftBank:[
      {id:'africangrey', label:'African grey'},
      {id:'reticulated', label:'Reticulated'},
      {id:'tiger', label:'Tiger'},
      {id:'polar', label:'Polar'},
      {id:'snow', label:'Snow'},
      {id:'blue', label:'Blue'},
      {id:'king', label:'King'},
      {id:'emperor', label:'Emperor'},
      {id:'monarch', label:'Monarch'},
      {id:'giant', label:'Giant'},
    ],
    rightBank:[
      {id:'africangrey', label:'Parrot', origin:'African grey parrot'},
      {id:'reticulated', label:'Python', origin:'Reticulated python'},
      {id:'tiger', label:'Salamander', origin:'Tiger salamander'},
      {id:'polar', label:'Bear', origin:'Polar bear'},
      {id:'snow', label:'Leopard', origin:'Snow leopard'},
      {id:'blue', label:'Whale', origin:'Blue whale'},
      {id:'king', label:'Cobra', origin:'King cobra'},
      {id:'emperor', label:'Penguin', origin:'Emperor penguin'},
      {id:'monarch', label:'Butterfly', origin:'Monarch butterfly'},
      {id:'giant', label:'Panda', origin:'Giant panda'},
    ]
  },
  {
    key:'blue', color:'var(--blue)', name:'Tree Identification',
    desc:'Match each tree name to its illustration.',
    type:'cross-match',
    thresholds:[2,5,8],
    total:10,
    instructions:'Tap a tree name, then tap the illustration that matches it — tap either again to deselect before it locks in.',
    connector:'↔',
    leftLabel:'Tree',
    rightLabel:'Illustration',
    rightIsImage:true,
    leftBank:[
      {id:'oak', label:'Oak'},
      {id:'pine', label:'Pine'},
      {id:'maple', label:'Maple'},
      {id:'palm', label:'Palm'},
      {id:'birch', label:'Birch'},
      {id:'willow', label:'Willow'},
      {id:'baobab', label:'Baobab'},
      {id:'cypress', label:'Cypress'},
      {id:'redwood', label:'Redwood'},
      {id:'cherry', label:'Cherry Blossom'},
    ],
    rightBank:[
      {id:'oak', svg:'<rect width="100" height="100" fill="#1a2a1a"/><rect x="44" y="60" width="12" height="35" fill="#5a3a1a"/><circle cx="50" cy="42" r="28" fill="#3d6b35"/><circle cx="32" cy="55" r="18" fill="#3d6b35"/><circle cx="68" cy="55" r="18" fill="#3d6b35"/>'},
      {id:'pine', svg:'<rect width="100" height="100" fill="#1a2a1a"/><rect x="44" y="75" width="12" height="20" fill="#5a3a1a"/><polygon points="50,8 28,40 72,40" fill="#2d5a2d"/><polygon points="50,28 22,60 78,60" fill="#2d5a2d"/><polygon points="50,48 16,80 84,80" fill="#2d5a2d"/>'},
      {id:'maple', svg:'<rect width="100" height="100" fill="#1a2a1a"/><rect x="44" y="65" width="12" height="30" fill="#5a3a1a"/><path d="M50 12 L56 32 L72 26 L64 44 L80 52 L60 56 L62 72 L50 62 L38 72 L40 56 L20 52 L36 44 L28 26 L44 32 Z" fill="#c94a1a"/>'},
      {id:'palm', svg:'<rect width="100" height="100" fill="#1a2a1a"/><path d="M46 95 Q50 65 54 32" stroke="#5a3a1a" stroke-width="6" fill="none"/><path d="M54 32 Q30 28 18 42" stroke="#2d7a2d" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M54 32 Q78 28 90 42" stroke="#2d7a2d" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M54 32 Q40 14 28 8" stroke="#2d7a2d" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M54 32 Q68 14 80 8" stroke="#2d7a2d" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M54 32 Q54 10 54 4" stroke="#2d7a2d" stroke-width="5" fill="none" stroke-linecap="round"/>'},
      {id:'birch', svg:'<rect width="100" height="100" fill="#1a2a1a"/><circle cx="50" cy="32" r="26" fill="#4a7a3d"/><rect x="44" y="50" width="12" height="45" fill="#e8e0d0"/><rect x="46" y="56" width="8" height="3" fill="#1a1a1a"/><rect x="45" y="66" width="10" height="3" fill="#1a1a1a"/><rect x="47" y="76" width="7" height="3" fill="#1a1a1a"/><rect x="45" y="86" width="9" height="3" fill="#1a1a1a"/>'},
      {id:'willow', svg:'<rect width="100" height="100" fill="#1a2a1a"/><rect x="45" y="38" width="10" height="57" fill="#5a3a1a"/><ellipse cx="50" cy="32" rx="28" ry="12" fill="#5a8a4a"/><path d="M25 40 Q18 60 15 78" stroke="#5a8a4a" stroke-width="3" fill="none"/><path d="M35 42 Q30 62 28 82" stroke="#5a8a4a" stroke-width="3" fill="none"/><path d="M50 44 Q50 64 50 84" stroke="#5a8a4a" stroke-width="3" fill="none"/><path d="M65 42 Q70 62 72 82" stroke="#5a8a4a" stroke-width="3" fill="none"/><path d="M75 40 Q82 60 85 78" stroke="#5a8a4a" stroke-width="3" fill="none"/>'},
      {id:'baobab', svg:'<rect width="100" height="100" fill="#1a2a1a"/><path d="M32 95 Q30 55 40 42 L60 42 Q70 55 68 95 Z" fill="#7a5a3a"/><ellipse cx="50" cy="38" rx="38" ry="10" fill="#3d6b35"/><ellipse cx="50" cy="28" rx="24" ry="6" fill="#3d6b35"/>'},
      {id:'cypress', svg:'<rect width="100" height="100" fill="#1a2a1a"/><rect x="47" y="85" width="6" height="12" fill="#5a3a1a"/><ellipse cx="50" cy="48" rx="14" ry="42" fill="#2d5a2d"/>'},
      {id:'redwood', svg:'<rect width="100" height="100" fill="#1a2a1a"/><rect x="46" y="85" width="8" height="12" fill="#5a3a1a"/><polygon points="50,4 30,40 70,40" fill="#2d5a2d"/><polygon points="50,26 24,62 76,62" fill="#2d5a2d"/><polygon points="50,48 18,84 82,84" fill="#2d5a2d"/>'},
      {id:'cherry', svg:'<rect width="100" height="100" fill="#1a2a1a"/><rect x="44" y="58" width="12" height="38" fill="#5a3a1a"/><circle cx="50" cy="42" r="24" fill="#e8a0b8"/><circle cx="30" cy="52" r="14" fill="#e8a0b8"/><circle cx="70" cy="52" r="14" fill="#e8a0b8"/><circle cx="40" cy="28" r="11" fill="#f0c0d0"/><circle cx="60" cy="28" r="11" fill="#f0c0d0"/>'},
    ]
  },
  {
    key:'purple', color:'var(--purple)', name:'Digit Count',
    desc:'Sort each animal by its number of digits per limb.',
    type:'categorize',
    thresholds:[2,5,8],
    total:10,
    instructions:'Count the digits (fingers/toes) on a single limb. Sort each animal into the correct bucket. Wrong guesses lock the item out.',
    fields:[
      {key:'gt5', label:'>5', emoji:'🖐️'},
      {key:'five', label:'5', emoji:'✋'},
      {key:'lt5', label:'<5', emoji:'👆'},
    ],
    fieldTotals:{gt5:3, five:4, lt5:3},
    items:[
      {name:'Human', field:'five'},
      {name:'Dog', field:'five'},
      {name:'Cat', field:'five'},
      {name:'Monkey', field:'five'},
      {name:'Giant Panda', field:'gt5'},
      {name:'Acanthostega', field:'gt5'},
      {name:'Ichthyostega', field:'gt5'},
      {name:'Horse', field:'lt5'},
      {name:'Cow', field:'lt5'},
      {name:'Eagle', field:'lt5'},
    ]
  },
];

/* ============ STATE ============ */
const state = {};
CATS.forEach(c=>{ state[c.key] = { orbs:0, lives:3, correct:0 }; });

/* ============ ORB & HEART RENDERING ============ */

function dotFill(correct, start, end, color){
  if(correct >= end) return color;
  if(correct > start){
    const pct = ((correct - start) / (end - start)) * 100;
    return `conic-gradient(${color} ${pct}%, var(--panel) 0)`;
  }
  return 'var(--panel)';
}

function dotsHTML(correct, thresholds, color){
  return [0,1,2].map(i=>{
    const start = i === 0 ? 0 : thresholds[i-1];
    const end = thresholds[i];
    const bg = dotFill(correct, start, end, color);
    return `<div class="icon-slot"><div class="dot" style="--accent:${color}; background:${bg};"></div></div>`;
  }).join('');
}

function dotsHTMLWithNewFill(correct, thresholds, color, prevCorrect){
  return [0,1,2].map(i=>{
    const start = i === 0 ? 0 : thresholds[i-1];
    const end = thresholds[i];
    const prevPct = Math.max(0, Math.min(100, ((prevCorrect - start) / (end - start)) * 100));
    const currPct = Math.max(0, Math.min(100, ((correct - start) / (end - start)) * 100));
    let bg;
    if(currPct <= 0){
      bg = 'var(--panel)';
    } else if(prevPct >= currPct){
      bg = `conic-gradient(${color} 0% ${currPct}%, var(--panel) ${currPct}% 100%)`;
    } else {
      const trans = `color-mix(in srgb, ${color} 40%, transparent)`;
      if(prevPct > 0){
        bg = `conic-gradient(${color} 0% ${prevPct}%, ${trans} ${prevPct}% ${currPct}%, var(--panel) ${currPct}% 100%)`;
      } else {
        bg = `conic-gradient(${trans} 0% ${currPct}%, var(--panel) ${currPct}% 100%)`;
      }
    }
    return `<div class="icon-slot"><div class="dot" style="--accent:${color}; background:${bg};"></div></div>`;
  }).join('');
}

function heartsHTML(lives, color){
  return [0,1,2].map(i=>{
    const filled = i < lives;
    return `<div class="icon-slot"><svg class="heart" viewBox="1.25 2.25 21.5 20.25" fill="${filled ? color : 'none'}" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>`;
  }).join('');
}

function badgeHTML(catKey){
  const c = CATS.find(x=>x.key===catKey);
  const s = state[catKey];
  return `<div style="text-align:right;">
    <div class="icon-row orbs">${dotsHTML(s.correct, c.thresholds, c.color)}</div>
    <div class="icon-row hearts">${heartsHTML(s.lives, c.color)}</div>
  </div>`;
}

/* ============ HUB RENDER ============ */
function renderHub(){
  document.getElementById('hubDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const rows = document.getElementById('catRows');
  rows.innerHTML = CATS.map(c=>{
    const s = state[c.key];
    return `<div class="cat-row" style="--accent:${c.color}" onclick="openGame('${c.key}')">
      <div class="cat-left">
        <p class="cat-name">${c.name}</p>
        <p class="cat-desc">${c.desc}</p>
      </div>
      <div class="cat-right">
        <div class="icon-row orbs">${dotsHTML(s.correct, c.thresholds, c.color)}</div>
        <div class="icon-row hearts">${heartsHTML(s.lives, c.color)}</div>
      </div>
    </div>`;
  }).join('');
}

/* ============ ORB / LIVES LOGIC ============ */
function registerCorrect(catKey, n=1){
  const c = CATS.find(x=>x.key===catKey);
  const s = state[catKey];
  s.correct += n;
  s.orbs = c.thresholds.filter(t=>s.correct>=t).length;
  renderHub();
}
function registerWrong(catKey){
  const s = state[catKey];
  s.lives = Math.max(0, s.lives-1);
  renderHub();
}
function refreshTopBadge(catKey){
  const el = document.getElementById('topbadge-'+catKey);
  if(el) el.innerHTML = badgeHTML(catKey);
}

/* ============ OVERLAY SHELL ============ */
function openGame(key){
  let el = document.getElementById('overlay-'+key);
  if(!el){
    el = document.createElement('div');
    el.className='overlay';
    el.id='overlay-'+key;
    document.getElementById('overlays').appendChild(el);
    buildGame(key, el);
  }
  el.classList.add('active');
  document.body.style.overflow='hidden';
}
function closeGame(key){
  document.getElementById('overlay-'+key).classList.remove('active');
  document.body.style.overflow='';
}

function shellHTML(c){
  return `
    <div class="game-wrap">
      <div class="game-top-bar" style="--accent:${c.color}">
        <div class="game-top-row">
          <div>
            <h1 class="game-title">${c.name}</h1>
            <p class="game-instructions">${c.desc}</p>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:12px;">
            <button class="back-link" onclick="closeGame('${c.key}')">← Menu</button>
            <div id="topbadge-${c.key}">${badgeHTML(c.key)}</div>
          </div>
        </div>
        <div class="rules-box">${c.instructions}</div>
      </div>
      <div id="gamebody-${c.key}"></div>
    </div>
  `;
}

function buildGame(key, el){
  const c = CATS.find(x=>x.key===key);
  el.innerHTML = shellHTML(c);
  const body = document.getElementById('gamebody-'+key);
  if(c.type==='fill') buildFill(c, body);
  if(c.type==='cross-match') buildCrossMatch(c, body);
  if(c.type==='categorize') buildCategorize(c, body);
}

/* ============ TYPE 1: FILL-IN-BLANK ============ */
function buildFill(c, body){
  body.innerHTML = c.items.map((item,i)=>`
    <div class="fill-row" id="fillrow-${c.key}-${i}">
      <div class="fill-clue">
        <span>${item.clue}</span>
        <div class="inline-orbs" id="inline-orbs-${c.key}-${i}"></div>
      </div>
      <div class="fill-input-line">
        <input type="text" id="fillinput-${c.key}-${i}" autocomplete="off" placeholder="Your answer">
        <button class="fill-submit" onclick="submitFill('${c.key}',${i})">↵</button>
      </div>
    </div>
  `).join('');
  c.items.forEach((item,i)=>{
    document.getElementById(`fillinput-${c.key}-${i}`).addEventListener('keydown', e=>{
      if(e.key==='Enter') submitFill(c.key, i);
    });
  });
}

function submitFill(key, i){
  const c = CATS.find(x=>x.key===key);
  const item = c.items[i];
  const input = document.getElementById(`fillinput-${key}-${i}`);
  const row = document.getElementById(`fillrow-${key}-${i}`);
  const val = input.value.trim().toLowerCase().replace(/\s+/g,'');
  if(row.classList.contains('correct')) return;
  const ok = item.answers.some(a=>a.toLowerCase().replace(/\s+/g,'')===val);
  const prevCorrect = state[key].correct;
  if(ok){
    row.classList.add('correct');
    input.disabled = true;
    registerCorrect(key,1);
    refreshTopBadge(key);
    const orbContainer = document.getElementById(`inline-orbs-${key}-${i}`);
    if(orbContainer){
      orbContainer.innerHTML = dotsHTMLWithNewFill(state[key].correct, c.thresholds, c.color, prevCorrect);
    }
  } else {
    row.classList.add('wrongflash');
    registerWrong(key);
    refreshTopBadge(key);
    setTimeout(()=>row.classList.remove('wrongflash'),400);
  }
}

/* ============ TYPE 2: TWO-BANK MATCHING WITH CENTER SLOTS ============ */
function buildCrossMatch(c, body){
  const gs = {
    leftSel:null, rightSel:null,
    removedLeft:new Set(), removedRight:new Set(),
    log:[]
  };

  function chipHTML(item, side){
    if(side==='right' && c.rightIsImage){
      return `<div class="img-chip" onclick="window.__ccm_${c.key}.pick('right','${item.id}')">
        <svg viewBox="0 0 100 100">${item.svg}</svg>
      </div>`;
    }
    return `<div class="chip" onclick="window.__ccm_${c.key}.pick('${side}','${item.id}')">${item.label}</div>`;
  }

  function centerSlotHTML(side){
    const selId = side==='left' ? gs.leftSel : gs.rightSel;
    if(!selId){
      const ph = side==='left' ? c.leftLabel : c.rightLabel;
      return `<div class="center-slot">${ph}</div>`;
    }
    const bank = side==='left' ? c.leftBank : c.rightBank;
    const item = bank.find(x=>x.id===selId);
    if(side==='right' && c.rightIsImage){
      return `<div class="center-slot img-slot filled" onclick="window.__ccm_${c.key}.pick('right','${item.id}')"><svg viewBox="0 0 100 100">${item.svg}</svg></div>`;
    }
    return `<div class="center-slot filled" onclick="window.__ccm_${c.key}.pick('${side}','${item.id}')">${item.label}</div>`;
  }

  function logEntryHTML(l){
    return `<div class="log-entry ${l.right?'right':'wrong'}">
      <div class="log-content">
        <span class="logtext">
          ${l.leftText} ${l.connector}
          ${l.image ? `<svg class="log-flag" viewBox="0 0 100 100">${l.image}</svg>` : l.rightText}
        </span>
        ${l.origin ? `<span class="logsub">${l.origin}</span>` : ''}
      </div>
      <div class="log-right">
        <div class="log-orbs">${dotsHTMLWithNewFill(l.correct, l.thresholds, l.color, l.prevCorrect)}</div>
        ${!l.right ? '<span class="badge">💔</span>' : ''}
      </div>
    </div>`;
  }

  function render(){
    const s = state[c.key];
    body.innerHTML = `
      <div class="bank-label">${c.leftLabel}</div>
      <div class="bank" id="leftbank-${c.key}"></div>
      <div class="center-strip">
        ${centerSlotHTML('left')}
        <span class="center-connector">${c.connector}</span>
        ${centerSlotHTML('right')}
      </div>
      <div class="bank-label">${c.rightLabel}</div>
      <div class="bank" id="rightbank-${c.key}"></div>
      <div class="log-title">
        <span>Guess Log</span>
        <div class="inline-orbs">${dotsHTML(s.correct, c.thresholds, c.color)}</div>
      </div>
      <div id="log-${c.key}"></div>
    `;
    const lb = document.getElementById(`leftbank-${c.key}`);
    c.leftBank.forEach(item=>{
      if(gs.removedLeft.has(item.id) || gs.leftSel===item.id) return;
      lb.insertAdjacentHTML('beforeend', chipHTML(item,'left'));
    });
    const rb = document.getElementById(`rightbank-${c.key}`);
    c.rightBank.forEach(item=>{
      if(gs.removedRight.has(item.id) || gs.rightSel===item.id) return;
      rb.insertAdjacentHTML('beforeend', chipHTML(item,'right'));
    });
    const logEl = document.getElementById(`log-${c.key}`);
    logEl.innerHTML = gs.log.slice().reverse().map(logEntryHTML).join('');
  }

  function pick(side, id){
    if(side==='left'){
      gs.leftSel = (gs.leftSel===id) ? null : id;
    } else {
      gs.rightSel = (gs.rightSel===id) ? null : id;
    }
    if(gs.leftSel && gs.rightSel){
      const leftItem = c.leftBank.find(x=>x.id===gs.leftSel);
      const rightItem = c.rightBank.find(x=>x.id===gs.rightSel);
      const right = gs.leftSel === gs.rightSel;
      const prevCorrect = state[c.key].correct;

      if(right){
        gs.removedLeft.add(gs.leftSel);
        gs.removedRight.add(gs.rightSel);
        registerCorrect(c.key,1);
      } else {
        registerWrong(c.key);
      }

      gs.log.push({
        leftText: leftItem.label,
        rightText: c.rightIsImage ? null : rightItem.label,
        image: c.rightIsImage ? rightItem.svg : null,
        connector: c.connector,
        origin: rightItem.origin || null,
        right: right,
        prevCorrect: prevCorrect,
        correct: state[c.key].correct,
        thresholds: c.thresholds,
        color: c.color
      });

      gs.leftSel = null; gs.rightSel = null;
      refreshTopBadge(c.key);
    }
    render();
  }

  window['__ccm_'+c.key] = { pick };
  render();
}

/* ============ TYPE 3: CATEGORIZE — ALL ITEMS AT ONCE ============ */
function buildCategorize(c, body){
  const fieldTotals = {...c.fieldTotals};
  const gs = {
    solved: new Array(c.items.length).fill(false),
    failed: new Array(c.items.length).fill(false),
    placedCount: Object.fromEntries(c.fields.map(f=>[f.key,0])),
    orbHTML: new Array(c.items.length).fill(''),
  };

  function render(){
    body.innerHTML = c.items.map((item,i)=>{
      const cls = gs.solved[i] ? 'correct' : (gs.failed[i] ? 'failed' : '');
      return `<div class="cat-item-row ${cls}" id="catrow-${c.key}-${i}">
        <div class="cat-item-name">
          <span>${item.name}</span>
          <div class="inline-orbs">${gs.orbHTML[i]}</div>
        </div>
        <div class="cat-buttons">
          ${c.fields.map(f=>{
            const need = fieldTotals[f.key] - gs.placedCount[f.key];
            const disabled = gs.solved[i] || gs.failed[i];
            return `<button class="cat-btn" ${disabled?'disabled':''} onclick="window.__ccz_${c.key}.pick(${i},'${f.key}')">
              <span class="emoji">${f.emoji}</span>
              <span>${f.label}</span>
              <span class="more">${need>0?`<b>${need}</b> more`:'complete'}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');
    const allDone = gs.solved.every((s,i)=>s || gs.failed[i]);
    if(allDone){
      const anyFailed = gs.failed.some(Boolean);
      body.insertAdjacentHTML('afterbegin', `<div class="done-banner">${anyFailed ? 'Puzzle complete (with mistakes)' : 'All items sorted!'}</div>`);
    }
  }

  window['__ccz_'+c.key] = {
    pick(i, field){
      if(gs.solved[i] || gs.failed[i]) return;
      const item = c.items[i];
      const prevCorrect = state[c.key].correct;
      if(item.field === field){
        gs.solved[i] = true;
        gs.placedCount[field]++;
        registerCorrect(c.key,1);
        gs.orbHTML[i] = dotsHTMLWithNewFill(state[c.key].correct, c.thresholds, c.color, prevCorrect);
      } else {
        gs.failed[i] = true;
        fieldTotals[item.field]--;
        registerWrong(c.key);
      }
      refreshTopBadge(c.key);
      render();
    }
  };
  render();
}

renderHub();
</script>
